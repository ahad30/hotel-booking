<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <title>You're offline · BEHB</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f6f7fb;
        color: #0b1020;
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        max-width: 380px;
        text-align: center;
        background: #fff;
        border-radius: 28px;
        padding: 36px 28px;
        box-shadow: 0 10px 40px -12px rgba(11, 16, 32, 0.18);
      }
      img { width: 120px; height: auto; }
      h1 { font-size: 22px; margin: 20px 0 8px; }
      p { margin: 0; color: #5b6478; line-height: 1.55; font-size: 15px; }
      button {
        margin-top: 24px;
        border: 0;
        border-radius: 999px;
        padding: 12px 22px;
        font: inherit;
        font-weight: 700;
        color: #fff;
        background: #0b1020;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.png" alt="BEHB" />
      <h1>You're offline</h1>
      <p>Check your connection and try again. Live prices and room availability need the internet.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
